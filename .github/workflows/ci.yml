# ClankerSpanker CI — RFC-000 house style.
#
# Jobs:
#   house-style  — RFC index, RFC citations, TEST-EXCEPTIONS, LAN-IP, test ratchet
#   host         — typecheck + build (tests already ran inside house-style)
#   desktop      — Electron shell smoke check (RFC-066); no install, electron is mocked
#
# Docs-only changes still run house-style (index integrity) but skip host build.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            heavy:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  house-style:
    name: House style
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install host deps
        working-directory: host
        run: npm ci
      - name: Allow user namespaces for per-job sandbox tests
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: House-style check
        run: python3 scripts/house-style-check.py

  host:
    name: Host — typecheck / build
    needs: [changes, house-style]
    if: ${{ needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: host/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  desktop:
    name: Desktop — smoke
    needs: [changes]
    if: ${{ needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Smoke (syntax, hardened webPreferences, IPC channels)
        run: node desktop/scripts/smoke.js
