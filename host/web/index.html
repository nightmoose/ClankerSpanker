<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClankerSpanker: run Grok Build and Claude Code agents from anywhere, on your machine</title>
  <meta name="description" content="Dispatch, watch, and approve Grok Build and Claude Code agents running on your own computer, from your phone, laptop, or browser. Local-first: your code, prompts, and token stay on your machines." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b0b10" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ClankerSpanker" />
  <meta property="og:url" content="https://clankerspanker.tech/" />
  <meta property="og:title" content="ClankerSpanker: drive your coding agents from anywhere" />
  <meta property="og:description" content="Grok Build and Claude Code agents run on your own machine. Dispatch them, watch them, and approve every edit and command from your phone, laptop, or browser. Try the demo, no install needed." />
  <meta property="og:image" content="https://clankerspanker.tech/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The ClankerSpanker demo: Grok and Claude agent sessions, one waiting for approval." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ClankerSpanker: drive your coding agents from anywhere" />
  <meta name="twitter:description" content="Grok Build and Claude Code agents on your own machine, with approvals from your phone, laptop, or browser." />
  <meta name="twitter:image" content="https://clankerspanker.tech/og.png" />
  <link rel="icon" href="./favicon.ico" sizes="32x32" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css?v=20261020a" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="logo">ClankerSpanker</span>
        <span id="conn" class="pill muted">offline</span>
      </div>
      <nav class="tabs" id="tabs">
        <button type="button" data-tab="active" class="tab active">Active</button>
        <button type="button" data-tab="grok" class="tab">Grok</button>
        <button type="button" data-tab="claude" class="tab">Claude</button>
        <button type="button" data-tab="compose" class="tab">Compose</button>
        <button type="button" data-tab="profiles" class="tab">Profiles</button>
      </nav>
      <div class="actions">
        <nav id="site-nav" class="site-nav" aria-label="Site">
          <a href="https://clankerspanker.tech/">Product</a>
          <a href="/docs/">Docs</a>
          <a href="/download/">Download</a>
        </nav>
        <button type="button" id="btn-host-update" title="Update this host from its git checkout">Update</button>
        <button type="button" id="btn-archived" class="icon-btn" title="Toggle archived">📥</button>
        <button type="button" id="btn-refresh" class="icon-btn" title="Refresh">↻</button>
        <a id="btn-terminal" href="./terminal.html" class="icon-btn" title="Host terminal">⌨</a>
        <button type="button" id="btn-settings" class="icon-btn" title="Connection">⚙</button>
      </div>
    </header>

    <p id="browser-limit" class="browser-limit hidden" role="status"></p>
    <div id="demo-strip" class="demo-strip hidden" role="status">
      <span><strong>Demo.</strong> Canned data. Nothing on this page talks to a network, and buttons that would change something only explain what they do.</span>
      <span class="demo-actions">
        <button type="button" class="secondary" data-connect>Connect your gateway</button>
        <button type="button" class="secondary" id="demo-exit">Exit demo</button>
      </span>
    </div>

    <main id="main">
      <section id="view-list" class="view"></section>
      <section id="view-detail" class="view hidden"></section>
      <section id="view-compose" class="view hidden"></section>
      <section id="view-profiles" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
    </main>

    <p id="banner" class="banner hidden"></p>
  </div>
  <script src="./app.js?v=20261020a" type="module"></script>
</body>
</html>
