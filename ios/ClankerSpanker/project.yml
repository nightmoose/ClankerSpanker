name: ClankerSpanker
options:
  bundleIdPrefix: com.nightmoose
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.10"
    CURRENT_PROJECT_VERSION: "24"
    DEVELOPMENT_TEAM: "XHS7K665C9"
    CODE_SIGN_STYLE: Automatic
    # Phone target turns this OFF — generated merge was dropping NSAppTransportSecurity.
    GENERATE_INFOPLIST_FILE: YES
targets:
  # ── iPhone only — DO NOT run this scheme on Mac ───────────
  ClankerSpanker:
    type: application
    platform: iOS
    sources:
      - path: ClankerSpanker
        excludes:
          - Info.plist
          - Info-macOS.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightmoose.clankerspanker
        PRODUCT_NAME: ClankerSpankerPhone
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "XHS7K665C9"
        SUPPORTS_MAC_DESIGNED_FOR_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Critical: do not generate+merge Info.plist — ATS for LAN HTTP was lost in the merge.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ClankerSpanker/Info.plist
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ClankerSpanker/ClankerSpanker-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: ClankerSpanker/ClankerSpanker-Release.entitlements
    info:
      path: ClankerSpanker/Info.plist
      properties:
        CFBundleDisplayName: ClankerSpanker
        CFBundleName: ClankerSpankerPhone
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Critical: do NOT set NSAllowsLocalNetworking here. On iOS 10+ it causes
        # NSAllowsArbitraryLoads to be ignored, and Tailscale 100.x is not "local".
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "ClankerSpanker connects to your Mac host on the local network and Tailscale to run agent sessions."
        NSCameraUsageDescription: "ClankerSpanker attaches camera photos to agent messages for debugging UI and app screens."
        NSPhotoLibraryUsageDescription: "ClankerSpanker attaches screenshots and photos to agent messages for debugging."
        CFBundleURLTypes:
          - CFBundleURLName: com.nightmoose.clankerspanker
            CFBundleURLSchemes:
              - clankerspanker
              - grokdispatch
        BGTaskSchedulerPermittedIdentifiers:
          - com.nightmoose.clankerspanker.refresh

  # ── Native Mac command center — THIS is the laptop app ──
  ClankerSpankerMac:
    type: application
    platform: macOS
    sources:
      - path: ClankerSpanker
        excludes:
          - Info.plist
          - Info-macOS.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightmoose.clankerspanker.mac
        PRODUCT_NAME: ClankerSpankerMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "XHS7K665C9"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        INFOPLIST_KEY_CFBundleDisplayName: ClankerSpanker
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © nightmoose"
    info:
      path: ClankerSpanker/Info-macOS.plist
      properties:
        CFBundleDisplayName: ClankerSpanker
        CFBundleName: ClankerSpanker
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.nightmoose.clankerspanker.mac
            CFBundleURLSchemes:
              - clankerspanker
              - grokdispatch
        NSPrincipalClass: NSApplication

  # ── Unit tests (RFC-046), hosted by the Mac app so @testable import works ──
  ClankerSpankerMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: ClankerSpankerMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightmoose.clankerspanker.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClankerSpankerMac.app/Contents/MacOS/ClankerSpankerMac"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "XHS7K665C9"

  # ── Menu-bar-only host configurator (no session UI) ──
  # Ships as its own .app so laptops without ClankerSpankerMac still
  # get an icon that surfaces host status / kickstart / /setup.
  ClankerSpankerHostTray:
    type: application
    platform: macOS
    sources:
      - path: HostTray
        excludes:
          - Info-HostTray.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightmoose.clankerspanker.hosttray
        PRODUCT_NAME: ClankerSpankerHostTray
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "XHS7K665C9"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_CFBundleDisplayName: ClankerSpanker Host Tray
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © nightmoose"
    info:
      path: HostTray/Info-HostTray.plist
      properties:
        CFBundleDisplayName: ClankerSpanker Host Tray
        CFBundleName: ClankerSpankerHostTray
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSPrincipalClass: NSApplication

# Two schemes with explicit names — never use “My Mac (Designed for iPad)” for phone.
schemes:
  # Mac laptop command center (native)
  ClankerSpanker:
    build:
      targets:
        ClankerSpankerMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClankerSpankerMacTests
  # Physical iPhone / Simulator only
  ClankerSpankerPhone:
    build:
      targets:
        ClankerSpanker: all
    run:
      config: Debug
  # Menu-bar host tray (no session UI). Ship on laptops that only host.
  ClankerSpankerHostTray:
    build:
      targets:
        ClankerSpankerHostTray: all
    run:
      config: Debug
