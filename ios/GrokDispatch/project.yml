name: ClankerSpanker
options:
  bundleIdPrefix: com.nightmoose
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.2.4"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: "XHS7K665C9"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSUserNotificationsUsageDescription: "ClankerSpanker notifies you when tasks finish or need approval."
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.nightmoose.clankerspanker
targets:
  ClankerSpanker:
    type: application
    platform: iOS
    sources:
      - path: GrokDispatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightmoose.clankerspanker
        PRODUCT_NAME: ClankerSpanker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "XHS7K665C9"
        EXECUTABLE_NAME: ClankerSpanker
    info:
      path: GrokDispatch/Info.plist
      properties:
        CFBundleDisplayName: ClankerSpanker
        CFBundleName: ClankerSpanker
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.nightmoose.clankerspanker
            CFBundleURLSchemes:
              - clankerspanker
              - grokdispatch
        BGTaskSchedulerPermittedIdentifiers:
          - com.nightmoose.clankerspanker.refresh
