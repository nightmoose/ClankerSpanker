name: ClankerSpanker
options:
  bundleIdPrefix: com.nightmoose
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.1"
    CURRENT_PROJECT_VERSION: "15"
    DEVELOPMENT_TEAM: "XHS7K665C9"
    CODE_SIGN_STYLE: Automatic
    # Phone target turns this OFF — generated merge was dropping NSAppTransportSecurity.
    GENERATE_INFOPLIST_FILE: YES
targets:
  # ── iPhone only — DO NOT run this scheme on Mac ───────────
  ClankerSpanker:
    type: application
    platform: iOS
    sources:
      - path: GrokDispatch
        excludes:
          - Info.plist
          - Info-macOS.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightmoose.clankerspanker
        PRODUCT_NAME: ClankerSpankerPhone
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "XHS7K665C9"
        SUPPORTS_MAC_DESIGNED_FOR_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Critical: do not generate+merge Info.plist — ATS for LAN HTTP was lost in the merge.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GrokDispatch/Info.plist
    info:
      path: GrokDispatch/Info.plist
      properties:
        CFBundleDisplayName: ClankerSpanker
        CFBundleName: ClankerSpankerPhone
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.nightmoose.clankerspanker
            CFBundleURLSchemes:
              - clankerspanker
              - grokdispatch
        BGTaskSchedulerPermittedIdentifiers:
          - com.nightmoose.clankerspanker.refresh

  # ── Native Mac command center — THIS is the laptop app ──
  ClankerSpankerMac:
    type: application
    platform: macOS
    sources:
      - path: GrokDispatch
        excludes:
          - Info.plist
          - Info-macOS.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightmoose.clankerspanker.mac
        PRODUCT_NAME: ClankerSpankerMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "XHS7K665C9"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        INFOPLIST_KEY_CFBundleDisplayName: ClankerSpanker
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © nightmoose"
    info:
      path: GrokDispatch/Info-macOS.plist
      properties:
        CFBundleDisplayName: ClankerSpanker
        CFBundleName: ClankerSpanker
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.nightmoose.clankerspanker.mac
            CFBundleURLSchemes:
              - clankerspanker
              - grokdispatch
        NSPrincipalClass: NSApplication

# Two schemes with explicit names — never use “My Mac (Designed for iPad)” for phone.
schemes:
  # Mac laptop command center (native)
  ClankerSpanker:
    build:
      targets:
        ClankerSpankerMac: all
    run:
      config: Debug
  # Physical iPhone / Simulator only
  ClankerSpankerPhone:
    build:
      targets:
        ClankerSpanker: all
    run:
      config: Debug
