openapi: 3.1.0
info:
  title: Grok Dispatch Host API
  version: 0.1.0
servers:
  - url: http://localhost:8787
paths:
  /health:
    get:
      summary: Liveness (no auth)
  /auth/validate:
    post:
      summary: Validate host token
      security: [{ bearerAuth: [] }]
  /projects:
    get:
      summary: Allowlisted projects
      security: [{ bearerAuth: [] }]
  /sessions:
    get:
      summary: List dispatched sessions
      security: [{ bearerAuth: [] }]
  /sessions/{id}:
    get:
      summary: Session detail
      security: [{ bearerAuth: [] }]
  /sessions/{id}/diff:
    get:
      summary: git diff in session cwd
      security: [{ bearerAuth: [] }]
  /sessions/{id}/files:
    get:
      summary: Session-relevant files (cwd, extra dirs, tool locations, attachments)
      security: [{ bearerAuth: [] }]
  /sessions/{id}/file:
    get:
      summary: Read a workspace file (path query; must be under cwd/extraDirs/attachments)
      security: [{ bearerAuth: [] }]
  /sessions/{id}/extra-dirs:
    patch:
      summary: Add extra workspace folders mid-session
      security: [{ bearerAuth: [] }]
  /bots:
    get:
      summary: List autonomous bots
      security: [{ bearerAuth: [] }]
    post:
      summary: Create a bot
      security: [{ bearerAuth: [] }]
  /bots/{id}:
    patch:
      summary: Update a bot
      security: [{ bearerAuth: [] }]
  /bots/{id}/run:
    post:
      summary: Manually fire a bot run (optional JSON { note } for a one-shot instruction)
      security: [{ bearerAuth: [] }]
  /bots/{id}/outbox:
    get:
      summary: List .bot-outbox markdown drafts for this bot's project
      security: [{ bearerAuth: [] }]
  /dispatch:
    post:
      summary: Create and start a task
      security: [{ bearerAuth: [] }]
  /sessions/attach-agy:
    post:
      summary: Attach an Antigravity / Gemini CLI conversation (agy --conversation)
      security: [{ bearerAuth: [] }]
  /sessions/{id}/tool-calls/{toolCallId}:
    get:
      summary: Full tool-call payload (rawInput/content JSON) for the ellipsis detail sheet
      security: [{ bearerAuth: [] }]
  /sessions/{id}/prompt:
    post:
      summary: Follow-up prompt on live session
      security: [{ bearerAuth: [] }]
  /sessions/{id}/approve:
    post:
      summary: Approve pending tool permission
      security: [{ bearerAuth: [] }]
  /sessions/{id}/reject:
    post:
      summary: Reject pending tool permission
      security: [{ bearerAuth: [] }]
  /sessions/{id}/cancel:
    post:
      summary: Cancel session
      security: [{ bearerAuth: [] }]
  /ws:
    get:
      summary: WebSocket event stream (?token=)
  /ws/terminal:
    get:
      summary: Interactive host PTY (login shell). Same host token as /ws (?token=). JSON frames in/out/resize.
  /app/terminal.html:
    get:
      summary: xterm.js page for the host terminal (static; socket is the auth gate)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
