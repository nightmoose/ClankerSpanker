openapi: 3.1.0
info:
  title: Grok Dispatch Host API
  version: 0.1.0
servers:
  - url: http://localhost:8787
paths:
  /health:
    get:
      summary: Liveness (no auth)
  /host/self:
    get:
      summary: |
        Stable host identity + basics for multi-host clients (RFC-024).
        Returns { hostId, name, version, bindPort }. hostId is minted on
        first boot and persisted in config.json.
      security: [{ bearerAuth: [] }]
  /ws/ticket:
    post:
      summary: |
        Single-use WebSocket ticket, valid 30 s (RFC-029). Returns
        { ticket, expiresInMs }. Connect with /ws?ticket=… or
        /ws/terminal?ticket=… instead of putting the host token in the URL.
      security: [{ bearerAuth: [] }]
  /auth/validate:
    post:
      summary: Validate host token
      security: [{ bearerAuth: [] }]
  /projects:
    get:
      summary: Allowlisted projects
      security: [{ bearerAuth: [] }]
    post:
      summary: Create a project { name, paths[], color?, defaultProfileId? }. Paths must be absolute or ~/ (RFC-032); response carries overlap warnings.
      security: [{ bearerAuth: [] }]
  /sessions:
    get:
      summary: List dispatched sessions (omits Grok subagent/helper chats). Grok rows carry creditsUsedDeltaPct (RFC-021 weekly-% burned this session).
      security: [{ bearerAuth: [] }]
  /sessions/{id}:
    get:
      summary: Session detail
      security: [{ bearerAuth: [] }]
    delete:
      summary: Permanently delete: cancels if running, removes JSON and attachments.
      security: [{ bearerAuth: [] }]
  /sessions/{id}/diff:
    get:
      summary: git diff in session cwd
      security: [{ bearerAuth: [] }]
  /sessions/{id}/files:
    get:
      summary: Session-relevant files (cwd, extra dirs, tool locations, attachments)
      security: [{ bearerAuth: [] }]
  /sessions/{id}/file:
    get:
      summary: Read a workspace file (path query; must be under cwd/extraDirs/attachments)
      security: [{ bearerAuth: [] }]
  /sessions/{id}/extra-dirs:
    patch:
      summary: Add extra workspace folders mid-session
      security: [{ bearerAuth: [] }]
  /bots:
    get:
      summary: List autonomous bots
      security: [{ bearerAuth: [] }]
    post:
      summary: Create a bot
      security: [{ bearerAuth: [] }]
  /bots/{id}:
    patch:
      summary: Update a bot
      security: [{ bearerAuth: [] }]
    get:
      summary: One bot.
      security: [{ bearerAuth: [] }]
  /bots/{id}/run:
    post:
      summary: Manually fire a bot run (optional JSON { note } for a one-shot instruction)
      security: [{ bearerAuth: [] }]
  /bots/{id}/outbox:
    get:
      summary: List .bot-outbox markdown drafts for this bot's project
      security: [{ bearerAuth: [] }]
  /push/register:
    post:
      summary: Register an APNs device token for this host
      security: [{ bearerAuth: [] }]
    delete:
      summary: Unregister an APNs device token
      security: [{ bearerAuth: [] }]
  /push/status:
    get:
      summary: Whether APNs is configured and how many devices are registered (no secrets)
      security: [{ bearerAuth: [] }]
  /push/test:
    post:
      summary: Send a one-shot test alert to registered devices
      security: [{ bearerAuth: [] }]
  /dispatch:
    post:
      summary: Create and start a task
      security: [{ bearerAuth: [] }]
  /sessions/attach-agy:
    post:
      summary: Attach an Antigravity / Gemini CLI conversation (agy --conversation)
      security: [{ bearerAuth: [] }]
  /sessions/{id}/tool-calls/{toolCallId}:
    get:
      summary: Full tool-call payload (rawInput/content JSON) for the ellipsis detail sheet
      security: [{ bearerAuth: [] }]
  /sessions/{id}/prompt:
    post:
      summary: Follow-up prompt on live session
      security: [{ bearerAuth: [] }]
  /sessions/{id}/approve:
    post:
      summary: Approve pending tool permission
      security: [{ bearerAuth: [] }]
  /sessions/{id}/reject:
    post:
      summary: Reject pending tool permission
      security: [{ bearerAuth: [] }]
  /sessions/{id}/cancel:
    post:
      summary: Cancel session
      security: [{ bearerAuth: [] }]
  /ws:
    get:
      summary: WebSocket event stream. Auth header, or ?ticket= from POST /ws/ticket (RFC-029). ?token= only from the host machine.
  /ws/terminal:
    get:
      summary: Interactive host PTY (login shell). Same auth as /ws (header or ?ticket=). JSON frames in/out/resize.
  /app/terminal.html:
    get:
      summary: xterm.js page for the host terminal (static; socket is the auth gate)
  /mcp/catalog:
    get:
      summary: Checked-in MCP catalog (names, urls, default profile assignment). No secrets.
      security: [{ bearerAuth: [] }]
  /profiles/{id}/mcp/apply-catalog:
    post:
      summary: Merge this profile's default catalog servers by name. This machine only. Body { replace?: boolean }.
      security: [{ bearerAuth: [] }]
  /profiles/{id}/mcp/{name}/oauth/start:
    post:
      summary: Start MCP OAuth (PKCE). This machine only. Returns { authorizeUrl, state }.
      security: [{ bearerAuth: [] }]
  /mcp/oauth/callback:
    get:
      summary: Loopback OAuth redirect (no host token). Exchanges code, stores tokens, HTML result.
  /profiles/{id}/mcp/{name}/oauth/logout:
    post:
      summary: Delete stored MCP OAuth tokens for this profile server. This machine only.
      security: [{ bearerAuth: [] }]
  /setup:
    get:
      summary: Pairing page: QR code + token. Host machine only (RFC-026); no CORS.
  /connect.json:
    get:
      summary: { hostURL, hostToken, deepLink, webApp } for local clients. Host machine only (RFC-026); no CORS.
  /profiles:
    get:
      summary: Agent profiles (no secrets). ?usage=1 adds Claude 5h/weekly usage; ?admin=1 (this machine only) adds full records.
      security: [{ bearerAuth: [] }]
    post:
      summary: Create a profile. This machine only.
      security: [{ bearerAuth: [] }]
  /profiles/{id}:
    patch:
      summary: Update a profile (color, model, …); secrets only from this machine.
      security: [{ bearerAuth: [] }]
    delete:
      summary: Delete a profile. This machine only; refused while a live session uses it.
      security: [{ bearerAuth: [] }]
  /profiles/{id}/login:
    post:
      summary: Open the host-side browser login for this agent account.
      security: [{ bearerAuth: [] }]
  /projects/discover:
    post:
      summary: Git repos on this host not yet registered (RFC-036/037; config "discoverRoots").
      security: [{ bearerAuth: [] }]
  /projects/{id}:
    get:
      summary: One project.
      security: [{ bearerAuth: [] }]
    patch:
      summary: Partial update; returns { project, warnings } (RFC-032).
      security: [{ bearerAuth: [] }]
    delete:
      summary: Soft-archive; ?hard=1 removes it and its attachments.
      security: [{ bearerAuth: [] }]
  /projects/{id}/attachments:
    post:
      summary: Upload a project attachment (base64 JSON body).
      security: [{ bearerAuth: [] }]
  /projects/{id}/attachments/{aid}:
    get:
      summary: Raw bytes of a project attachment.
      security: [{ bearerAuth: [] }]
    delete:
      summary: Delete a project attachment.
      security: [{ bearerAuth: [] }]
  /tasks:
    get:
      summary: Tasks across every session on this host; ?status=open.
      security: [{ bearerAuth: [] }]
  /internal/claude-approval:
    post:
      summary: Claude PreToolUse hook parks a phone approval (host-internal).
      security: [{ bearerAuth: [] }]
  /internal/claude-approval/{id}:
    get:
      summary: Claude hook polls an approval until approved/rejected (host-internal).
      security: [{ bearerAuth: [] }]
  /sessions/attach:
    post:
      summary: Resume a Grok Build session from disk / TUI.
      security: [{ bearerAuth: [] }]
  /sessions/attach-claude:
    post:
      summary: Open a Claude Code conversation from history.
      security: [{ bearerAuth: [] }]
  /sessions/{id}/events:
    get:
      summary: Replay events after ?since=N (reconnect catch-up).
      security: [{ bearerAuth: [] }]
  /sessions/{id}/answer-questions:
    post:
      summary: Answer a pending agent questionnaire.
      security: [{ bearerAuth: [] }]
  /sessions/{id}/archive:
    post:
      summary: Hide from the Active list.
      security: [{ bearerAuth: [] }]
  /sessions/{id}/unarchive:
    post:
      summary: Restore to the Active list.
      security: [{ bearerAuth: [] }]
  /sessions/{id}/close:
    post:
      summary: Stop the agent and mark the session completed + archived.
      security: [{ bearerAuth: [] }]
  /sessions/{id}/notes:
    post:
      summary: Create a note on this session.
      security: [{ bearerAuth: [] }]
  /sessions/{id}/tasks:
    post:
      summary: Create a task on this session.
      security: [{ bearerAuth: [] }]
  /sessions/{id}/project:
    post:
      summary: Assign or detach a project { projectId | null }.
      security: [{ bearerAuth: [] }]
  /sessions/{id}/title:
    post:
      summary: Rename the session.
      security: [{ bearerAuth: [] }]
  /sessions/{id}/transfer:
    post:
      summary: Move the chat to another profile.
      security: [{ bearerAuth: [] }]
  /sessions/{id}/reincarnate:
    post:
      summary: Archive this chat and start a fresh one seeded with a summary.
      security: [{ bearerAuth: [] }]
  /sessions/{id}/review:
    post:
      summary: Non-destructive critique of recent work in a sibling session.
      security: [{ bearerAuth: [] }]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
